<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リーグ戦対戦表</title>
    <style>
        /* ページ全体とベースの文字設定 */
        body { font-family: sans-serif; padding: 8px; margin: 0; background-color: #fff; color: #333; }

        /* 入力フォームエリアのスタイル（画面表示用・印刷時は非表示） */
        .no-print { margin-bottom: 8px; background: #f9f9f9; padding: 10px; border-radius: 8px; }
        h2 { margin-top: 0 !important; margin-bottom: 8px !important; font-size: 1.1em; }

        /* 入力グループのスタイル */
        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 0.9em; }
        .form-group textarea { width: 100%; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; height: 200px; }

        /* ボタン共通スタイル */
        button { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; background-color: #007bff; color: white; font-weight: bold; font-size: 14px; margin-right: 5px; margin-bottom: 5px; }
        button:disabled { background-color: #ccc; }

        /* フォーム切替ボタンのスタイル（対戦順テーブルのすぐ左下） */
        .toggle-form-btn { 
            background-color: #343a40; 
            color: white; 
            font-size: 12px;
            padding: 4px 10px;
            margin-top: 15px;
            margin-bottom: 15px;
            display: inline-block;
        }
        .toggle-form-btn:hover { background-color: #23272b; }

        /* 各ページコンテナの共通スタイル（画面用） */
        .page { margin-bottom: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1px; }
        .date-display { font-size: 0.7em; color: #666; }

        /* セクションタイトルのスタイル（画面用） */
        .page h2.section-title { font-size: 11pt; margin: 0 0 1px 0 !important; }
        .page h2.match-list-title { margin-top: 10px !important; }

        /* テーブル共通のスタイル（画面用） */
        .page table { border-collapse: collapse; width: 100%; table-layout: fixed; }
        .page th, .page td { border: 1px solid #aaa; text-align: center; position: relative; }
        .page th { background: #eee; }

        /* 対戦順表の「赤」「白」などのヘッダーを細字にする設定 */
        .match-list-column th { font-weight: normal; }

        .name-header { overflow-wrap: break-word; word-break: break-all; line-height: 1.1; overflow: hidden; font-weight: normal; }
        .diagonal-line { background: #eee; background-image: linear-gradient(to top right, transparent 49%, #666 50%, #666 51%, transparent 52%); }
        
        .match-list-column .match-num-col { width: 24px; }
        .match-list-column td:first-child { width: 24px; }

        .match-num { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #888; text-align: center; width: 100%; pointer-events: none; font-size: 10px; }
        
        .match-list-container { display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; }
        .print-col-1 { min-width: 50%; max-width: 50%; }
        .print-col-2 { min-width: 44%; flex: 1; }
        .print-col-3 { min-width: 31%; max-width: 32%; flex: 1; }

        .match-list-container table th,
        .match-list-container table td {
            height: 19px;
            font-size: 9px;
            padding: 0;
        }

        .print-only { display: none; }
        .print-date { display: none; }

        /* ==========================================
            元通りの通常画面プレビュー用の高さ・フォントサイズ
           ========================================== */
        .page[data-n="7"] table th, .page[data-n="7"] table td,
        .page[data-n="8"] table th, .page[data-n="8"] table td,
        .page[data-n="9"] table th, .page[data-n="9"] table td,
        .page[data-n="10"] table th, .page[data-n="10"] table td,
        .page[data-n="11"] table th, .page[data-n="11"] table td,
        .page[data-n="12"] table th, .page[data-n="12"] table td { height: 21px; font-size: 9px; padding: 0; }

        .page[data-n="4"] table th, .page[data-n="4"] table td,
        .page[data-n="5"] table th, .page[data-n="5"] table td,

            font-size: 11px;
            padding: 1px;
        }

        .page[data-n="4"] .match-list-column table th, .page[data-n="4"] .match-list-column table td,
        .page[data-n="5"] .match-list-column table th, .page[data-n="5"] .match-list-column table td,
        .page[data-n="6"] .match-list-column table th, .page[data-n="6"] .match-list-column table td,
        .page[data-n="7"] .match-list-column table th, .page[data-n="7"] .match-list-column table td {
            height: 30px;
            font-size: 12px;
        }

        .page[data-n="8"] .match-list-column table th, 
        .page[data-n="8"] .match-list-column table td {
            height: 25px;
        }

        .page[data-n="9"] .match-list-column table th, 
        .page[data-n="9"] .match-list-column table td,
        .page[data-n="10"] .match-list-column table th, 
        .page[data-n="10"] .match-list-column table td,
        .page[data-n="11"] .match-list-column table th, 
        .page[data-n="11"] .match-list-column table td,
        .page[data-n="12"] .match-list-column table th, 
        .page[data-n="12"] .match-list-column table td { 
            height: 23px; 
            font-size: 9px; 
        }

            完全独立した実際の印刷時の設定（@media print）
           ========================================== */
        @media print {
            .no-print, .toggle-form-btn { display: none !important; }
            
            @page { size: A4 portrait; margin: 2mm 5mm 1mm 5mm; }

            .page {
                margin-top: 0 !important;
                margin-bottom: 0 !important;
                position: relative !important;
            }

            .section-header { position: relative !important; }
            .date-display { display: none !important; }

            .print-date {
                display: block !important;
                position: absolute !important;
                top: 3px !important;
                font-size: 8pt !important;
                color: #333 !important;
                white-space: nowrap !important;

            body.print-mode-2pages .page h2.match-list-title {

<body>

    <!-- 入力・操作エリア -->
    <div id="formArea" class="no-print">
        <h2>リーグ戦作成ツール</h2>
        <div class="form-group">
            <label>参加者名（3〜12人、改行区切り）</label>
            <textarea id="names" placeholder="Aさん&#10;Bさん&#10;Cさん"></textarea>
        </div>
        <button onclick="generate()">表を作成</button>
        <div style="margin-top: 5px;">
            <button id="printBtn" onclick="printOnePage()" disabled style="background-color: #6c757d;">1ページにまとめて印刷</button>
            <button id="print2PagesBtn" onclick="printTwoPages()" disabled style="background-color: #6c757d;">2ページに分けて印刷</button>
        </div>
    </div>

    <div id="output"></div>

    <script>

        };

        function generate() {
            const textarea = document.getElementById('names');
            const names = textarea.value.split('\n').map(n => n.trim()).filter(n => n !== "");
            const n = names.length;
            
            if (n < 3 || n > 12) { alert("3〜12人で入力してください"); return; }

            const now = new Date();
            const dateStr = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()}`;

            const matrix = LEAGUE_TABLES[n];
            let matches = [];
            
            for (let i = 0; i < n; i++) {
                for (let j = i + 1; j < n; j++) {
                    matches.push({ p1: names[i], p2: names[j], originalNum: matrix[i][j] });
                }
            }
            matches.sort((a, b) => a.originalNum - b.originalNum);
            matches.forEach((m, idx) => m.num = idx + 1);

            let printCols = 1;
            if (n >= 6 && n <= 8) printCols = 2;
            else if (n >= 9) printCols = 3;

            let html = `<div class="page" data-n="${n}">` +
                       `<div class="section-header">` +
                       `<h2 class="section-title">対戦表（${n}人・${matches.length}試合）</h2>` +
                       `<div class="date-display">${dateStr}</div>` +
                       `<div class="print-date">${dateStr}</div>` +
                       `</div>` +
                       `<table><tr><th></th>`;
            names.forEach(name => html += `<th class="name-header">${name}</th>`);
            html += `<th class="print-only">本数</th><th class="print-only">勝</th><th class="print-only">負</th><th class="print-only">分</th><th class="print-only">順位</th></tr>`;

            for (let i = 0; i < n; i++) {
                html += `<tr><th class="name-header">${names[i]}</th>`;
                for (let j = 0; j < n; j++) {
                    const match = matches.find(m => (m.p1 === names[i] && m.p2 === names[j]) || (m.p1 === names[j] && m.p2 === names[i]));
                    html += (i === j) ? `<td class="diagonal-line"></td>` : `<td><span class="match-num">${match ? match.num : ""}</span></td>`;
                }
                html += `<td class="print-only"></td><td class="print-only"></td><td class="print-only"></td><td class="print-only"></td><td class="print-only"></td></tr>`;
            }
            
            html += `</table>` +
                    `<h2 class="section-title match-list-title">対戦順</h2>` +
                    `<div class="match-list-container">`;

            const printColClass = `print-col-${printCols}`;
            const matchesPerCol = Math.ceil(matches.length / printCols);

            for (let c = 0; c < printCols; c++) {
                html += `<div class="match-list-column ${printColClass}"><table><tr><th class="match-num-col"></th><th>赤</th><th>白</th></tr>`;
                const colMatches = matches.slice(c * matchesPerCol, (c + 1) * matchesPerCol);
                colMatches.forEach(m => html += `<tr><td>${m.num}</td><td>${m.p1}</td><td>${m.p2}</td></tr>`);
                html += `</table></div>`;
            }

            html += `</div>` +
                    `<button id="toggleBtn" class="toggle-form-btn" onclick="toggleForm()">入力フォームを隠す</button>` +
                    `</div>`;

            document.getElementById('output').innerHTML = html;
            
            const btn1 = document.getElementById('printBtn');
            const btn2 = document.getElementById('print2PagesBtn');
            btn1.disabled = false;
            btn1.style.backgroundColor = '#28a745';
            btn2.disabled = false;
            btn2.style.backgroundColor = '#17a2b8';
        }

        function printOnePage() {
            document.body.classList.remove('print-mode-2pages');
            document.body.classList.add('print-mode-1page');
            window.print();
        }

        function printTwoPages() {
            document.body.classList.remove('print-mode-1page');
            document.body.classList.add('print-mode-2pages');
            window.print();
        }

        function toggleForm() {
            const formArea = document.getElementById('formArea');
            const btn = document.getElementById('toggleBtn');
            if (formArea.style.display === 'none') {
                formArea.style.display = 'block';
                btn.textContent = '入力フォームを隠す';
            } else {
                formArea.style.display = 'none';
                btn.textContent = '入力フォームを表示する';
            }
        }
    </script>
</body>
</html>
